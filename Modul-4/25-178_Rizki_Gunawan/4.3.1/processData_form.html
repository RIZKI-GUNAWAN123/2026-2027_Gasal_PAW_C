<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Data Pribadi</title>
</head>
<body>
    <h2>Form Data Pribadi</h2>
    <form action="processData.php" method="POST">
        <label for="surname">Surname:</label><br>
        <input type="text" id="surname" name="surname" required><br><br>
        <label for="email">Email address:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        <label for="address">Street Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="35" required></textarea><br><br>
        <label for="state">State:</label><br>
        <select id="state" name="state" required>
            <option value="">-- Pilih State --</option>
            <option value="New South Wales">New South Wales</option>
            <option value="Queensland">Queensland</option>
            <option value="South Australia">South Australia</option>
            <option value="Tasmania">Tasmania</option>
            <option value="Victoria">Victoria</option>
            <option value="Western Australia">Western Australia</option>
        </select><br><br>
        <input type="hidden" name="country" value="Australia">
        <span>Gender:</span><br>
        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>
        <input type="checkbox" id="vegetarian" name="vegetarian" value="Yes">
        <label for="vegetarian">Vegetarian?</label><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
